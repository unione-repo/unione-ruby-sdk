# Generated: the tests of the package on every push and pull request (and before a release). Do not edit, the next
# release replaces it. The tests need no network: the API is faked.
name: Tests

on:
  push:
    branches: ["**"]  # not the tags: release.yml runs the tests of a tag itself
  pull_request:
  workflow_call:

permissions:
  contents: read

# a new push of the ref cancels the run of the previous one (called by release.yml: the group of the tag)
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        v: ["2.7", "3.1", "3.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.v }}
      - run: |
          if [ -f Gemfile ]; then bundle install; fi
          ruby -Ilib -Itest -e 'Dir["test/**/*_test.rb"].sort.each { |f| require File.expand_path(f) }'
